[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "logspec"
version = "0.1.0"
description = "로그 설계서(YAML) → 검증 SQL 자동 생성"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.5", "pandas>=2.2", "pyarrow>=20", "pyyaml>=6", "tabulate>=0.9"]

[project.optional-dependencies]
llm = ["ollama>=0.5"]

[tool.setuptools]
packages = ["logspec"]
