table: actions
description: 인게임 행동 로그 (사냥·루팅·스킬·이동·채팅·제작). 가장 큰 테이블
time_field: ts
fields:
  ts:          {type: timestamp, not_null: true, within_period: true}
  account_id:  {type: int, not_null: true, fk: accounts.account_id}
  session_id:  {type: int, not_null: true, fk: sessions.session_id}
  action_type: {type: enum, not_null: true, values: [kill, loot, skill, move, chat, craft]}
  map_id:      {type: int, not_null: true, fk: maps.map_id}
  skill_id:    {type: int, not_null: true, min: 0, max: 30}      # 0 = 스킬 없음
  x:           {type: float, not_null: true, min: 0, max: 1000}
  y:           {type: float, not_null: true, min: 0, max: 1000}
rules:
  - name: action_within_session
    description: 행동은 자기 세션의 접속 구간 안에서 일어나고, 세션 주인과 계정이 같다
    violations: |
      SELECT a.* FROM actions a JOIN sessions s USING (session_id)
      WHERE a.ts < s.login_at OR a.ts > s.logout_at OR a.account_id <> s.account_id
  - name: skill_only_on_combat
    description: 스킬 번호는 kill/skill 행동에만 붙는다
    row: "(action_type IN ('kill', 'skill')) OR skill_id = 0"
duplicates: [session_id, ts, action_type]
volume: {daily_ratio_vs_median7: [0.6, 1.7]}
drift: {fields: [action_type], psi_max: 0.1}
